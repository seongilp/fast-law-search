name: Claude Auto-fix on CI failure

# CI 워크플로우가 main 에서 실패하면, Claude Code Action 이 에러 로그를 읽고
# 수정 브랜치를 만들어 PR 을 연다.
#
# 사전 준비 (레포 Settings 에서 1회):
#   1) Settings → Secrets and variables → Actions → New repository secret
#      이름: ANTHROPIC_API_KEY   값: console.anthropic.com 에서 발급한 키
#   2) Settings → Actions → General → Workflow permissions
#      "Read and write permissions" 체크 + "Allow GitHub Actions to create
#      and approve pull requests" 체크
#
# 코드 버그(경로 오류, 타입 에러, 깨진 import 등)는 잘 고치지만,
# 인프라 문제(서버 다운/시크릿 누락/네트워크)는 코드로 못 고친다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  autofix:
    # 실패했을 때만, 그리고 main 브랜치 이벤트일 때만
    if: >
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude auto-fix
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The "CI" workflow just failed on the main branch of this repo.
            The project is a Vite + React + TypeScript app under the `ui/`
            directory (a Typesense-backed Korean law search UI).

            Please:
            1. Reproduce the failure locally by running, from the `ui/`
               directory: `pnpm install --frozen-lockfile` then `pnpm build`
               (which runs `tsc -b && vite build`).
            2. Read the error output and identify the root cause.
            3. Fix ONLY what is needed to make the build pass. Do not change
               unrelated code, behavior, or the Typesense connection defaults.
            4. Create a new branch `autofix/ci-<short-sha>` and open a pull
               request to `main` describing what failed and how you fixed it.

            If the failure is NOT a code problem the build can fix (e.g. an
            infrastructure/secret/network issue), do not open a PR — instead
            leave a brief explanation in the job log and stop.
