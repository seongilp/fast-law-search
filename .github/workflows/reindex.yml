name: Reindex Typesense

# 원본 법령 레포(legalize-kr/legalize-kr)는 우리 소유가 아니므로
# webhook 을 받을 수 없다. 대신 하루 1회 cron 으로 당겨와(pull) 재색인하고,
# 필요할 때 수동 실행(workflow_dispatch)도 가능하게 한다.
on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST (UTC 18:00)
  workflow_dispatch: {}

concurrency:
  group: reindex
  cancel-in-progress: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this repo - indexer code)
        uses: actions/checkout@v4

      - name: Checkout law corpus (source repo)
        uses: actions/checkout@v4
        with:
          repository: legalize-kr/legalize-kr
          path: corpus
          # 공개 레포면 토큰 불필요. private 면 LAW_REPO_TOKEN(PAT) 필요.
          token: ${{ secrets.LAW_REPO_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install indexer deps
        working-directory: search/indexer
        run: pip install -r requirements.txt

      - name: Zero-downtime reindex (alias swap)
        working-directory: search
        env:
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_PORT: ${{ secrets.TYPESENSE_PORT }}
          TYPESENSE_PROTOCOL: ${{ secrets.TYPESENSE_PROTOCOL }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          TYPESENSE_COLLECTION: ${{ secrets.TYPESENSE_COLLECTION || 'kr_laws' }}
          # 원본 레포를 corpus/ 로 체크아웃했으므로 그 안의 kr/ 를 가리킨다.
          LAW_ROOT: ${{ github.workspace }}/corpus/kr
        run: python indexer/index.py --alias
