name: 판례 증분 수집

# NOTE: 이 워크플로는 fast-law-search 저장소에 있습니다.
# 판례 코드(collector_prec/)는 이 저장소에 있고,
# 판례 데이터(prec/)는 legalize-kr/legalize-kr 저장소에 저장됩니다.
# 따라서 두 저장소를 모두 체크아웃합니다.
#
# 필요 시크릿:
#   LAW_GO_KR_OC      — 국가법령정보시스템 OpenAPI 키
#   LEGALIZE_KR_TOKEN — legalize-kr/legalize-kr 쓰기 권한이 있는 PAT

on:
  schedule:
    - cron: "30 19 * * *"   # 매일 04:30 KST (UTC 19:30)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect-precedents
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # 1) 수집기 코드가 있는 이 저장소(fast-law-search) 체크아웃
      - name: fast-law-search 체크아웃 (수집기 코드)
        uses: actions/checkout@v4
        with:
          path: fast-law-search

      # 2) 판례 데이터가 저장되는 legalize-kr 저장소 체크아웃
      - name: legalize-kr 체크아웃 (판례 데이터)
        uses: actions/checkout@v4
        with:
          repository: legalize-kr/legalize-kr
          token: ${{ secrets.LEGALIZE_KR_TOKEN }}
          fetch-depth: 0
          path: legalize-kr

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치
        working-directory: fast-law-search
        run: pip install -r collector_prec/requirements.txt

      - name: 판례 수집(신규만)
        working-directory: fast-law-search
        env:
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
          PREC_ROOT: ${{ github.workspace }}/legalize-kr/prec
        run: python -m collector_prec.fetch

      - name: 신규 판례 단일 커밋
        working-directory: fast-law-search
        env:
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
          PREC_ROOT: ${{ github.workspace }}/legalize-kr/prec
          LEGALIZE_KR_REPO: ${{ github.workspace }}/legalize-kr
        run: |
          git -C ${{ github.workspace }}/legalize-kr config user.name  "github-actions[bot]"
          git -C ${{ github.workspace }}/legalize-kr config user.email "github-actions[bot]@users.noreply.github.com"
          python -m collector_prec.commit

      - name: legalize-kr 에 푸시
        run: git -C ${{ github.workspace }}/legalize-kr push
