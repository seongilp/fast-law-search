name: 판례 증분 수집

# 판례 코드(collector_prec/)와 데이터(prec/)가 같은 저장소(fast-law-search)에 있어
# 별도 PAT 없이 기본 GITHUB_TOKEN 으로 자기 저장소에 commit·push 한다.
#
# 필요 시크릿:
#   LAW_GO_KR_OC — 국가법령정보시스템 OpenAPI 키

on:
  schedule:
    - cron: "30 19 * * *"   # 매일 04:30 KST (UTC 19:30)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-precedents
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치
        run: pip install -r collector_prec/requirements.txt

      - name: 판례 수집(신규만)
        env:
          LAW_GO_KR_OC: ${{ secrets.LAW_GO_KR_OC }}
        run: python -m collector_prec.fetch

      - name: 신규 판례 단일 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python -m collector_prec.commit
          git push
